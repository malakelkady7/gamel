<style>
  :root{
    --cream:#FBF6EE; --card:#FFFFFF; --ink:#3A2E28; --muted:#7A6B62;
    --accent:#C8553D; --accent-soft:#F6E1D8; --line:#EADFD2; --ok:#4F7A5A;
    --radius:18px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--cream);color:var(--ink);
    font-family:"Cairo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    font-size:17px;line-height:1.55;-webkit-text-size-adjust:100%}
  .wrap{max-width:480px;margin:0 auto;padding:16px 18px 40px;min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
  .logo{font-weight:700;font-size:1.35rem;color:var(--accent);letter-spacing:.3px}
  .lang{display:flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px}
  .lang button{border:0;background:transparent;font:inherit;font-size:.9rem;padding:8px 14px;border-radius:999px;color:var(--muted);cursor:pointer;min-height:40px}
  .lang button[aria-pressed="true"]{background:var(--accent);color:#fff}
  .step{display:none;flex:1;flex-direction:column}
  .step.active{display:flex;animation:fade .25s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  h1{font-size:1.65rem;line-height:1.3;margin:28px 0 12px}
  h2{font-size:1.3rem;margin:6px 0 16px}
  .note{color:var(--muted);font-size:.92rem;margin:0 0 24px}
  .hero-art{height:150px;border-radius:var(--radius);background:linear-gradient(135deg,var(--accent-soft),#FDEFE6 60%,#F3E7DA);
    display:flex;align-items:center;justify-content:center;font-size:3.4rem;margin-top:8px}
  .btn{display:block;width:100%;border:0;border-radius:14px;font:inherit;font-weight:700;font-size:1.05rem;
    padding:15px 18px;min-height:54px;cursor:pointer;background:var(--accent);color:#fff;transition:transform .08s}
  .btn:active{transform:scale(.98)}
  .btn.secondary{background:var(--card);color:var(--ink);border:1.5px solid var(--line);font-weight:600}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .progress{display:flex;gap:6px;margin-bottom:14px}
  .progress span{flex:1;height:5px;border-radius:5px;background:var(--line)}
  .progress span.on{background:var(--accent)}
  .options{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .options.single-col{grid-template-columns:1fr}
  .opt{border:1.5px solid var(--line);background:var(--card);border-radius:14px;font:inherit;font-size:1rem;
    padding:14px 12px;min-height:58px;cursor:pointer;color:var(--ink);text-align:center}
  .opt:active,.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
  .back{margin-top:auto;padding-top:22px}
  .back button{background:none;border:0;font:inherit;color:var(--muted);padding:12px 4px;cursor:pointer;min-height:44px}
  .cards{display:flex;flex-direction:column;gap:14px;margin-bottom:18px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  .ph img{width:100%;height:100%;object-fit:cover;display:block}
  .ph{height:200px;overflow:hidden;background:#EFE6DA;display:flex;align-items:center;justify-content:center;color:#B9A898;font-size:.85rem}
  .card-body{padding:14px 16px 16px}
  .brand{display:inline-block;font-weight:700;font-size:.82rem;letter-spacing:.6px;text-transform:uppercase;
    color:var(--accent);background:var(--accent-soft);padding:3px 10px;border-radius:999px;margin-bottom:6px}
  .item{font-weight:700;font-size:1.08rem;margin:2px 0}
  .desc{color:var(--muted);font-size:.93rem;margin:2px 0 10px}
  .price{font-weight:700;font-size:1.1rem;margin-bottom:12px}
  .banner{display:none;background:#EAF2EC;border:1px solid #CFE0D3;color:var(--ok);border-radius:14px;padding:14px 16px;margin-bottom:16px;font-weight:600}
  .banner.show{display:block}
  .ask{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:16px}
  .ask p{margin:0 0 12px;font-weight:600}
  .yn{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .thanks-sm{color:var(--ok);font-size:.92rem;margin:10px 0 0;display:none}
  .remind{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:18px}
  .check{display:flex;gap:12px;align-items:flex-start;cursor:pointer;min-height:44px}
  .check input{width:24px;height:24px;accent-color:var(--accent);flex:none;margin-top:2px}
  .contact{display:none;margin-top:14px}
  .contact.show{display:block}
  .contact input{width:100%;font:inherit;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;min-height:50px}
  .contact input:focus{outline:none;border-color:var(--accent)}
  .consent{font-size:.84rem;color:var(--muted);margin:8px 0 0}
  .err{color:var(--accent);font-size:.85rem;margin:6px 0 0;display:none}
  .center{text-align:center}
  .big-emoji{font-size:3.2rem;margin:40px 0 4px}
  .stack > * + *{margin-top:10px}
  [dir="ltr"] .back button::before{content:"← "}
  [dir="rtl"] .back button::before{content:"→ "}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo" data-i18n="brand"></div>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="ar">العربية</button>
      <button type="button" data-lang="en">English</button>
    </div>
  </header>

  <!-- 1. Welcome -->
  <section class="step active" id="s-welcome">
    <div class="hero-art" aria-hidden="true">🎁</div>
    <h1 data-i18n="welcomeTitle"></h1>
    <p class="note" data-i18n="prototypeNote"></p>
    <button class="btn" id="startBtn" data-i18n="start"></button>
  </section>

  <!-- 2-4. Questions (filled by JS) -->
  <section class="step" id="s-q1"></section>
  <section class="step" id="s-q2"></section>
  <section class="step" id="s-q3"></section>

  <!-- 5. Shortlist -->
  <section class="step" id="s-shortlist">
    <div class="progress"><span class="on"></span><span class="on"></span><span class="on"></span><span class="on"></span></div>
    <h2 data-i18n="shortlistTitle"></h2>
    <div class="banner" id="orderBanner" role="status" aria-live="polite" data-i18n="orderMsg"></div>
    <div class="cards" id="cards"></div>
    <div class="ask">
      <p data-i18n="worthQ"></p>
      <div class="yn">
        <button class="opt" id="worthYes" data-i18n="yes"></button>
        <button class="opt" id="worthNo" data-i18n="no"></button>
      </div>
      <p class="thanks-sm" id="worthThanks" data-i18n="thanksShort"></p>
    </div>
    <button class="btn secondary" id="toRemind" data-i18n="continue"></button>
    <div class="back"><button type="button" data-back="s-q3" data-i18n="back"></button></div>
  </section>

  <!-- 7. Reminder -->
  <section class="step" id="s-remind">
    <h2 data-i18n="remindTitle"></h2>
    <div class="remind">
      <label class="check">
        <input type="checkbox" id="remindChk">
        <span data-i18n="remindLabel"></span>
      </label>
      <div class="contact" id="contactBox">
        <input type="text" id="contactInput" inputmode="email" autocomplete="off" data-i18n-ph="contactPh">
        <p class="consent" data-i18n="consent"></p>
        <p class="err" id="contactErr" data-i18n="contactErr"></p>
      </div>
    </div>
    <div class="stack">
      <button class="btn" id="finishBtn" data-i18n="finish"></button>
    </div>
    <div class="back"><button type="button" data-back="s-shortlist" data-i18n="back"></button></div>
  </section>

  <!-- Done -->
  <section class="step" id="s-done">
    <div class="center">
      <div class="big-emoji" aria-hidden="true">💛</div>
      <h2 data-i18n="doneTitle"></h2>
      <p class="note" data-i18n="doneText"></p>
    </div>
  </section>
</div>

<script>
/* =====================================================================
   3) TEXT (Arabic + English)
   ===================================================================== */
const T = {
  ar: {
    brand:"جميل", welcomeTitle:"مش عارف تجيب هدية إيه؟ قولنا هي لمين وميزانيتك كام",
    prototypeNote:"ده نموذج تجريبي. مفيش أي طلب هيتنفّذ.", start:"يلا نبدأ",
    q1:"المناسبة إيه؟", q2:"الهدية لمين؟", q3:"ميزانيتك كام؟", back:"رجوع",
    shortlistTitle:"اخترنالك الهدايا دي", order:"اطلب ده (الدفع عند الاستلام)",
    orderMsg:"ده اختبار. مفيش حاجة اتطلبت ومش هيتخصم منك أي فلوس. شكرًا إنك ساعدتنا!",
    worthQ:"هل في هدية من دول تستاهل تفكر فيها؟", yes:"أيوه", no:"لأ", thanksShort:"شكرًا على رأيك!",
    continue:"التالي", photo:"صورة المنتج",
    remindTitle:"خطوة أخيرة (اختيارية)", remindLabel:"فكّرني قبل عيد الميلاد أو المناسبة الجاية",
    contactPh:"رقم الموبايل أو الإيميل",
    consent:"هنستخدم بياناتك بس عشان نبعتلك التذكير ده، وهنمسحها لو طلبت.",
    contactErr:"اكتب رقم موبايل أو إيميل، أو شيل العلامة.", finish:"إنهاء",
    doneTitle:"شكرًا ليك!", doneText:"ده كان نموذج تجريبي. مفيش طلب اتعمل ومش هيتخصم منك أي حاجة.",
    currency:"ج.م"
  },
  en: {
    brand:"Gamel", welcomeTitle:"Not sure what to give? Tell us who it's for and your budget",
    prototypeNote:"This is a prototype. No order will be placed.", start:"Start",
    q1:"What's the occasion?", q2:"Who is it for?", q3:"What's your budget?", back:"Back",
    shortlistTitle:"Here's a shortlist for you", order:"Order this (cash on delivery)",
    orderMsg:"This is a test. Nothing was ordered and you will not be charged. Thank you for helping us!",
    worthQ:"Is one of these worth considering?", yes:"Yes", no:"No", thanksShort:"Thanks for your answer!",
    continue:"Continue", photo:"Product photo",
    remindTitle:"One last step (optional)", remindLabel:"Remind me before the next birthday or occasion",
    contactPh:"Phone or email",
    consent:"We will use your contact only to send this reminder and will delete it on request.",
    contactErr:"Enter a phone number or email, or untick the box.", finish:"Finish",
    doneTitle:"Thank you!", doneText:"This was a prototype. Nothing was ordered and you will not be charged.",
    currency:"EGP"
  }
};

const QUESTIONS = [
  { id:"occasion", step:"s-q1", title:"q1", event:"q1_answered", options:[
    {v:"birthday", en:"Birthday", ar:"عيد ميلاد"},
    {v:"mothers_day", en:"Mother's Day", ar:"عيد الأم"},
    {v:"wedding", en:"Wedding", ar:"فرح"},
    {v:"graduation", en:"Graduation", ar:"تخرّج"},
    {v:"newborn", en:"Newborn", ar:"مولود جديد"},
    {v:"other", en:"Other", ar:"حاجة تانية"} ]},
  { id:"recipient", step:"s-q2", title:"q2", event:"q2_answered", options:[
    {v:"friend", en:"Friend", ar:"صاحب/صاحبة"},
    {v:"partner", en:"Partner", ar:"شريك/شريكة الحياة"},
    {v:"mother", en:"Mother", ar:"الأم"},
    {v:"father", en:"Father", ar:"الأب"},
    {v:"sibling", en:"Sibling", ar:"أخ/أخت"},
    {v:"colleague", en:"Colleague", ar:"زميل/زميلة"},
    {v:"other", en:"Other", ar:"حد تاني"} ]},
  { id:"budget", step:"s-q3", title:"q3", event:"q3_answered", single:true, options:[
    {v:"under300", en:"Under EGP 300", ar:"أقل من ٣٠٠ ج.م"},
    {v:"300-500", en:"EGP 300-500", ar:"٣٠٠ - ٥٠٠ ج.م"},
    {v:"500-800", en:"EGP 500-800", ar:"٥٠٠ - ٨٠٠ ج.م"},
    {v:"over800", en:"Over EGP 800", ar:"أكتر من ٨٠٠ ج.م"} ]}
];

/* =====================================================================
   4) STATE + TRACKING
   ===================================================================== */
const params = new URLSearchParams(location.search);
const SRC = (params.get("src") || "direct").slice(0, 80);
let lang = CONFIG.DEFAULT_LANG;
const answers = { occasion:"", recipient:"", budget:"" };

function makeId(){
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return "v-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 10);
}
let VISITOR_ID;
try {
  VISITOR_ID = localStorage.getItem("gamel_vid");
  if (!VISITOR_ID) { VISITOR_ID = makeId(); localStorage.setItem("gamel_vid", VISITOR_ID); }
} catch (e) { VISITOR_ID = makeId(); }

if (!CONFIG.SHEET_WEBAPP_URL) {
  console.warn("[Gamel] CONFIG.SHEET_WEBAPP_URL is empty — events are logged to the console only.");
}

function track(event, extra){
  const payload = Object.assign({
    timestamp: new Date().toISOString(),
    event, visitorId: VISITOR_ID, src: SRC, lang,
    occasion: answers.occasion, recipient: answers.recipient, budget: answers.budget,
    item: "", brand: "", contact: ""
  }, extra || {});
  console.log("[Gamel event]", payload);
  if (!CONFIG.SHEET_WEBAPP_URL) return;
  try {
    // text/plain + no-cors avoids the CORS preflight that Apps Script cannot answer
    fetch(CONFIG.SHEET_WEBAPP_URL, {
      method:"POST", mode:"no-cors", keepalive:true,
      headers:{ "Content-Type":"text/plain;charset=utf-8" },
      body: JSON.stringify(payload)
    }).catch(err => console.warn("[Gamel] send failed", err));
  } catch (err) { console.warn("[Gamel] send failed", err); }
  // Mirror key events to GA4 if present
  if (window.gtag) window.gtag("event", event, { src: SRC, item: payload.item || undefined });
  if (window.clarity) window.clarity("event", event);
}

/* Analytics loaders (only if IDs are filled) */
(function loadAnalytics(){
  if (CONFIG.CLARITY_ID) {
    (function(c,l,a,r,i,t,y){c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
      t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
      y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
    })(window, document, "clarity", "script", CONFIG.CLARITY_ID);
  }
  if (CONFIG.GA_MEASUREMENT_ID) {
    const s = document.createElement("script");
    s.async = true; s.src = "https://www.googletagmanager.com/gtag/js?id=" + CONFIG.GA_MEASUREMENT_ID;
    document.head.appendChild(s);
    window.dataLayer = window.dataLayer || [];
    window.gtag = function(){ dataLayer.push(arguments); };
    gtag("js", new Date()); gtag("config", CONFIG.GA_MEASUREMENT_ID);
  }
})();

/* =====================================================================
   5) UI
   ===================================================================== */
const $ = id => document.getElementById(id);
let current = "s-welcome";

function show(id){
  document.querySelectorAll(".step").forEach(s => s.classList.toggle("active", s.id === id));
  current = id; window.scrollTo(0, 0);
}

function esc(s){ return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function fmtPrice(n){
  const num = Number(n).toLocaleString(lang === "ar" ? "ar-EG" : "en-US");
  return lang === "ar" ? num + " " + T.ar.currency : "EGP " + num;
}
function pick(g, field){ return (lang === "ar" && g[field + "Ar"]) ? g[field + "Ar"] : g[field]; }

function renderQuestions(){
  QUESTIONS.forEach((q, i) => {
    const el = $(q.step);
    const bars = [0,1,2,3].map(n => `<span class="${n <= i ? "on" : ""}"></span>`).join("");
    el.innerHTML = `
      <div class="progress">${bars}</div>
      <h2>${esc(T[lang][q.title])}</h2>
      <div class="options ${q.single ? "single-col" : ""}">
        ${q.options.map(o => `<button type="button" class="opt ${answers[q.id] === o.v ? "sel" : ""}" data-q="${q.id}" data-v="${o.v}">${esc(o[lang])}</button>`).join("")}
      </div>
      <div class="back"><button type="button" data-back="${i === 0 ? "s-welcome" : QUESTIONS[i-1].step}">${esc(T[lang].back)}</button></div>`;
  });
}

function shortlist(){
  return GIFTS.filter(g => g.budget === answers.budget).slice(0, 5);
}

function renderCards(){
  const items = shortlist();
  $("cards").innerHTML = items.map((g, i) => `
    <article class="card">
      <div class="ph">${g.image ? `<img src="${esc(g.image)}" alt="${esc(pick(g, "itemName"))}" loading="lazy" onerror="this.replaceWith(document.createTextNode(''))">` : `<span aria-hidden="true">${esc(T[lang].photo)}</span>`}</div>
      <div class="card-body">
        <div class="brand">${esc(pick(g, "brandName"))}</div>
        <div class="item">${esc(pick(g, "itemName"))}</div>
        <p class="desc">${esc(pick(g, "shortDescription"))}</p>
        <div class="price">${esc(fmtPrice(g.priceEGP))}</div>
        <button type="button" class="btn" data-order="${i}">${esc(T[lang].order)}</button>
      </div>
    </article>`).join("");
}

function applyLang(){
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = T[lang][el.dataset.i18n]);
  document.querySelectorAll("[data-i18n-ph]").forEach(el => el.placeholder = T[lang][el.dataset.i18nPh]);
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === lang));
  document.title = lang === "ar" ? "جميل | هدايا" : "Gamel | Gifts";
  renderQuestions();
  if (answers.budget) renderCards();
}

/* Events */
document.addEventListener("click", e => {
  const t = e.target.closest("button");
  if (!t) return;

  if (t.dataset.lang) { lang = t.dataset.lang; try{localStorage.setItem("gamel_lang", lang);}catch(_){} applyLang(); return; }
  if (t.dataset.back) { show(t.dataset.back); return; }

  if (t.dataset.q) {
    const q = QUESTIONS.find(x => x.id === t.dataset.q);
    answers[q.id] = t.dataset.v;
    track(q.event, { answer: t.dataset.v });
    const idx = QUESTIONS.indexOf(q);
    renderQuestions();
    if (idx < QUESTIONS.length - 1) { show(QUESTIONS[idx + 1].step); }
    else {
      renderCards();
      $("orderBanner").classList.remove("show");
      show("s-shortlist");
      track("shortlist_viewed", { item: shortlist().map(g => g.itemName).join(" | ") });
    }
    return;
  }

  if (t.dataset.order !== undefined) {
    const g = shortlist()[Number(t.dataset.order)];
    track("order_clicked", { item: g.itemName, brand: g.brandName, priceEGP: g.priceEGP });
    $("orderBanner").classList.add("show");
    $("orderBanner").scrollIntoView({ behavior:"smooth", block:"center" });
    return;
  }
});

$("startBtn").addEventListener("click", () => { track("start_clicked"); show("s-q1"); });

function worth(ans){
  $("worthYes").classList.toggle("sel", ans === "yes");
  $("worthNo").classList.toggle("sel", ans === "no");
  $("worthThanks").style.display = "block";
  track(ans === "yes" ? "worth_considering_yes" : "worth_considering_no");
}
$("worthYes").addEventListener("click", () => worth("yes"));
$("worthNo").addEventListener("click", () => worth("no"));
$("toRemind").addEventListener("click", () => show("s-remind"));

$("remindChk").addEventListener("change", e => {
  $("contactBox").classList.toggle("show", e.target.checked);
  $("contactErr").style.display = "none";
  if (!e.target.checked) $("contactInput").value = "";
});

$("finishBtn").addEventListener("click", () => {
  if ($("remindChk").checked) {
    const v = $("contactInput").value.trim();
    const looksOk = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v) || /^\+?[\d\s\-]{8,15}$/.test(v);
    if (!looksOk) { $("contactErr").style.display = "block"; $("contactInput").focus(); return; }
    track("reminder_opt_in", { contact: v });   // contact is ONLY sent here
  }
  show("s-done");
});

/* Init */
try { const saved = localStorage.getItem("gamel_lang"); if (saved === "ar" || saved === "en") lang = saved; } catch(_){}
if (params.get("lang") === "en" || params.get("lang") === "ar") lang = params.get("lang");
applyLang();
track("page_view");
</script>
</body>
</html>
